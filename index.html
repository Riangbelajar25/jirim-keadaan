<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perubahan Keadaan Jirim - 物态变化大冒险</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .level-tabs {
            display: flex;
            background: #e2e8f0;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: white;
            color: #3182ce;
            border-top: 3px solid #3182ce;
        }
        .display-area {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            background: #f7fafc;
        }
        .display-area img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }
        .control-panel {
            padding: 20px;
            background: white;
            border-top: 1px solid #edf2f7;
        }
        .info-card {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .info-title {
            font-weight: bold;
            color: #2b6cb0;
            margin-bottom: 4px;
        }
        .info-desc {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.5;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-heat {
            background: #ff6b6b;
            color: white;
        }
        .btn-cool {
            background: #4dabf7;
            color: white;
        }
        .btn-action {
            background: #51cf66;
            color: white;
        }
    </style>
</head>
<body>

    <h1>✨ Perubahan Keadaan Jirim ✨</h1>
    <p class="subtitle">物态变化大冒险：点击切换标签或控制温度，观察 Jirim 的形态变化！</p>

    <div class="game-container">
        <!-- 关卡切换标签 -->
        <div class="level-tabs">
            <button class="tab-btn active" onclick="selectLevel(1)">1. Peleburan (熔化)</button>
            <button class="tab-btn" onclick="selectLevel(2)">2. Pembekuan (凝固)</button>
            <button class="tab-btn" onclick="selectLevel(3)">3. Penyejatan (蒸发)</button>
            <button class="tab-btn" onclick="selectLevel(4)">4. Pemeluwapan (冷凝)</button>
            <button class="tab-btn" onclick="selectLevel(5)">5. Penyubliman (升华)</button>
        </div>

        <!-- 图片展示区 -->
        <div class="display-area">
            <img id="game-image" src="" alt="Perubahan Keadaan Jirim">
        </div>

        <!-- 交互控制与说明区 -->
        <div class="control-panel">
            <div class="info-card">
                <div class="info-title" id="info-title">标题</div>
                <div class="info-desc" id="info-desc">说明文本</div>
            </div>

            <div class="action-btns" id="action-buttons">
                <!-- 动态生成按钮 -->
            </div>
        </div>
    </div>

    <script>
        // 绑定 GitHub 仓库中真实的图片文件名
        const levels = {
            1: {
                title: "🔥 关卡 1：Peleburan (Melting / 熔化)",
                desc: "Pepejal (固态冰块) 吸收热量 (Menyerap haba)，熔化成 Cecair (液态水)！",
                img: "1000040257.jpg",
                btns: [
                    { text: "☀️ Menyerap Haba (吸热熔化)", action: "heat" },
                    { text: "➡️ Seterusnya: Pembekuan (下一关)", action: "next", target: 2 }
                ]
            },
            2: {
                title: "❄️ 关卡 2：Pembekuan (Freezing / 凝固)",
                desc: "Cecair (液态水) 释放热量 (Bebas haba)，凝固成 Pepejal (固态冰块)！",
                img: "1000040321.jpg",
                btns: [
                    { text: "❄️ Bebas Haba (散热凝固)", action: "cool" },
                    { text: "➡️ Seterusnya: Penyejatan (下一关)", action: "next", target: 3 }
                ]
            },
            3: {
                title: "☁️ 关卡 3：Penyejatan (Evaporation / 蒸发)",
                desc: "Cecair (水) 吸收热量变热后，蒸发成 Gas (水蒸气/云朵)！",
                img: "1000040322.jpg",
                btns: [
                    { text: "♨️ Menyerap Haba (吸热蒸发)", action: "heat" },
                    { text: "➡️ Seterusnya: Pemeluwapan (下一关)", action: "next", target: 4 }
                ]
            },
            4: {
                title: "💧 关卡 4：Pemeluwapan (Condensation / 冷凝)",
                desc: "Gas (高温水蒸气) 遇到较凉的锅盖释放热量，凝结成 Cecair (小水珠)！",
                img: "1000040324.png",
                btns: [
                    { text: "💧 Bebas Haba (遇冷凝结)", action: "cool" },
                    { text: "➡️ Seterusnya: Penyubliman (下一关)", action: "next", target: 5 }
                ]
            },
            5: {
                title: "🌸 关卡 5：Penyubliman (Sublimation / 升华)",
                desc: "Pepejal (樟脑丸) 不经过液态，直接吸收热量升变成 Gas (防虫气体)！",
                img: "1000040323.png",
                btns: [
                    { text: "🦋 Penyubliman (升华气体)", action: "action" },
                    { text: "🔄 Mula Semula (重新开始)", action: "next", target: 1 }
                ]
            }
        };

        let currentLevel = 1;

        function selectLevel(levelNum) {
            currentLevel = levelNum;
            const data = levels[levelNum];

            // 更新图片与文字
            document.getElementById('game-image').src = data.img;
            document.getElementById('info-title').innerText = data.title;
            document.getElementById('info-desc').innerText = data.desc;

            // 更新标签样式
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, idx) => {
                if (idx + 1 === levelNum) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // 更新控制按钮
            const btnContainer = document.getElementById('action-buttons');
            btnContainer.innerHTML = '';
            
            data.btns.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'btn ';
                if (b.action === 'heat') btn.className += 'btn-heat';
                else if (b.action === 'cool') btn.className += 'btn-cool';
                else btn.className += 'btn-action';

                btn.innerText = b.text;
                btn.onclick = () => {
                    if (b.target) {
                        selectLevel(b.target);
                    } else {
                        alert(`已触发：${b.text}！请观察图中的状态变化。`);
                    }
                };
                btnContainer.appendChild(btn);
            });
        }

        // 初始化游戏
        selectLevel(1);
    </script>
</body>
</html>
