<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perubahan Keadaan Jirim - 科学互动游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .stage-title {
            background: #3182ce;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        /* 第一关：配对样式 */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: #edf2f7;
            border: 2px solid #cbd5e0;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #2d3748;
            transition: all 0.2s;
            user-select: none;
        }
        .card:hover {
            background: #e2e8f0;
        }
        .card.selected {
            background: #feebc8;
            border-color: #dd6b20;
            color: #c05621;
        }
        .card.matched {
            background: #c6f6d5;
            border-color: #38a169;
            color: #22543d;
            cursor: default;
        }

        /* 第二关：看图填字样式（自适应调整） */
        .puzzle-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .img-display {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 5px;
        }
        .word-input-container {
            display: flex;
            gap: 4px;
            margin: 10px 0;
            width: 100%;
            justify-content: center;
        }
        .letter-box {
            flex: 1;
            max-width: 38px;
            height: 42px;
            border: 2px solid #4a5568;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            background: #fff;
            padding: 0;
        }
        .letter-box.correct {
            background: #c6f6d5;
            border-color: #38a169;
            color: #22543d;
        }

        .btn-action {
            background: #48bb78;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-action:hover {
            background: #38a169;
        }
        .hidden {
            display: none !important;
        }
        .hint {
            color: #718096;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>✨ Perubahan Keadaan Jirim ✨</h1>
    <p class="subtitle">Sains Tingkatan 1: 关卡挑战游戏</p>

    <!-- 第一关：配对游戏 -->
    <div id="stage1" class="container">
        <div class="stage-title">第一关：词汇与概念配对 (Padankan Terminology)</div>
        <p class="hint" style="margin-bottom: 12px;">点击左边的词汇，再点击右边对应的说明进行匹配！</p>
        
        <div class="match-grid">
            <div class="column" id="terms-column"></div>
            <div class="column" id="descs-column"></div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button id="to-stage2-btn" class="btn-action hidden" onclick="startStage2()">🎉 挑战成功！进入第二关：看图填字 ➡️</button>
        </div>
    </div>

    <!-- 第二关：看图填字 -->
    <div id="stage2" class="container hidden">
        <div class="stage-title" id="puzzle-progress">第二关：看图填字 (Isi Tempat Kosong) [1/6]</div>
        
        <div class="puzzle-box">
            <img id="puzzle-img" class="img-display" src="" alt="Soalan Gambar">
            <p id="puzzle-hint-text" class="hint" style="font-size: 15px; font-weight: bold; color: #2d3748;"></p>
            
            <div class="word-input-container" id="inputs-container"></div>

            <button class="btn-action" onclick="checkPuzzleAnswer()">提交答案 (Semak Jawapan)</button>
        </div>
    </div>

    <script>
        // 语音朗读函数
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'ms-MY';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 游戏数据
        const matchData = [
            { id: 1, term: "Peleburan (融化)", desc: "Pepejal ➔ Cecair (吸热 Menyerap haba)" },
            { id: 2, term: "Pembekuan (凝固)", desc: "Cecair ➔ Pepejal (散热 Bebas haba)" },
            { id: 3, term: "Penyejatan (蒸发)", desc: "Cecair ➔ Gas (在任何温度下发生)" },
            { id: 4, term: "Pendidihan (沸腾)", desc: "Cecair ➔ Gas (在沸点 100°C 发生)" },
            { id: 5, term: "Kondensasi (凝结)", desc: "Gas ➔ Cecair (散热 Bebas haba)" },
            { id: 6, term: "Pemejalwapan (升华)", desc: "Pepejal ➔ Gas (不经过液态)" }
        ];

        const puzzleData = [
            { img: "1000040257.jpg", answer: "PELEBURAN", hint: "冰块受热变成水的过程 (Pepejal menjadi cecair)" },
            { img: "1000040321.jpg", answer: "PEMBEKUAN", hint: "水放入冰箱变成冰块的过程 (Cecair menjadi pepejal)" },
            { img: "1000040322.jpg", answer: "PENYEJATAN", hint: "水吸热变成水蒸气 (Cecair menjadi gas)" },
            { img: "pendidihan.jpg", answer: "PENDIDIHAN", hint: "水加热到 100°C 快速变成气体 (Berlaku pada takat didih)" },
            { img: "1000040324.png", answer: "KONDENSASI", hint: "水蒸气遇冷变成水滴 (Gas menjadi cecair)" },
            { img: "1000040323.png", answer: "PEMEJALWAPAN", hint: "樟脑丸直接变成气体 (Pepejal menjadi gas)" }
        ];

        // 第一关逻辑
        let selectedTerm = null;
        let selectedDesc = null;
        let matchedCount = 0;

        function initStage1() {
            const termsCol = document.getElementById('terms-column');
            const descsCol = document.getElementById('descs-column');

            const shuffledTerms = [...matchData].sort(() => Math.random() - 0.5);
            const shuffledDescs = [...matchData].sort(() => Math.random() - 0.5);

            shuffledTerms.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerText = item.term;
                el.dataset.id = item.id;
                el.onclick = () => selectCard(el, 'term');
                termsCol.appendChild(el);
            });

            shuffledDescs.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerText = item.desc;
                el.dataset.id = item.id;
                el.onclick = () => selectCard(el, 'desc');
                descsCol.appendChild(el);
            });
        }

        function selectCard(el, type) {
            if (el.classList.contains('matched')) return;

            if (type === 'term') {
                if (selectedTerm) selectedTerm.classList.remove('selected');
                selectedTerm = el;
                selectedTerm.classList.add('selected');
            } else {
                if (selectedDesc) selectedDesc.classList.remove('selected');
                selectedDesc = el;
                selectedDesc.classList.add('selected');
            }

            if (selectedTerm && selectedDesc) {
                if (selectedTerm.dataset.id === selectedDesc.dataset.id) {
                    selectedTerm.className = 'card matched';
                    selectedDesc.className = 'card matched';
                    selectedTerm = null;
                    selectedDesc = null;
                    matchedCount++;
                    if (matchedCount === matchData.length) {
                        document.getElementById('to-stage2-btn').classList.remove('hidden');
                    }
                } else {
                    setTimeout(() => {
                        if (selectedTerm) selectedTerm.classList.remove('selected');
                        if (selectedDesc) selectedDesc.classList.remove('selected');
                        selectedTerm = null;
                        selectedDesc = null;
                    }, 400);
                }
            }
        }

        // 第二关逻辑
        let currentPuzzleIdx = 0;

        function startStage2() {
            document.getElementById('stage1').classList.add('hidden');
            document.getElementById('stage2').classList.remove('hidden');
            loadPuzzle(0);
        }

        function loadPuzzle(idx) {
            currentPuzzleIdx = idx;
            const data = puzzleData[idx];
            
            document.getElementById('puzzle-progress').innerText = `第二关：看图填字 (Isi Tempat Kosong) [${idx + 1}/${puzzleData.length}]`;
            document.getElementById('puzzle-img').src = data.img;
            document.getElementById('puzzle-hint-text').innerText = data.hint;

            const container = document.getElementById('inputs-container');
            container.innerHTML = '';

            for (let i = 0; i < data.answer.length; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'letter-box';
                input.dataset.index = i;

                input.oninput = (e) => {
                    if (e.target.value && i < data.answer.length - 1) {
                        container.children[i + 1].focus();
                    }
                };
                
                input.onkeydown = (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) {
                        container.children[i - 1].focus();
                    }
                };

                container.appendChild(input);
            }
            container.children[0].focus();
        }

        function checkPuzzleAnswer() {
            const data = puzzleData[currentPuzzleIdx];
            const inputs = document.querySelectorAll('.letter-box');
            let userAns = '';
            
            inputs.forEach(inp => userAns += inp.value.toUpperCase());

            if (userAns === data.answer) {
                inputs.forEach(inp => inp.classList.add('correct'));
                
                speakWord(data.answer);

                setTimeout(() => {
                    if (currentPuzzleIdx + 1 < puzzleData.length) {
                        alert("🎉 YOU ARE WELL DONE.");
                        loadPuzzle(currentPuzzleIdx + 1);
                    } else {
                        alert("🎉 YOU ARE WELL DONE.\n恭喜你！全部通关！你已经完全掌握了 Perubahan Keadaan Jirim！");
                    }
                }, 400);
            } else {
                alert("💪 加油哦");
            }
        }

        initStage1();
    </script>
</body>
</html>
